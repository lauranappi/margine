  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f0e8;--ink:#2c1f0e;--ink-mid:#6b5540;--ink-light:#a08c75;--accent:#7a4f2d;--border:#d4c4ad;--serif:'Playfair Display',Georgia,serif;--body:'Source Serif 4',Georgia,serif}
    body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;min-height:100vh}
    .progress-bar{position:fixed;top:0;left:0;width:0%;height:3px;background:#7a4f2d;z-index:100;transition:width .1s linear}
    nav{border-bottom:1px solid var(--border);padding:1.4rem 2rem;display:flex;align-items:baseline;gap:2rem}
    .nav-logo{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);text-decoration:none}
    .nav-back{font-size:13px;color:var(--ink-light);text-decoration:none}
    .nav-back:hover{color:var(--accent)}
    .article-header{max-width:700px;margin:4rem auto 3rem;padding:0 2rem}
    .art-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-light);margin-bottom:1.2rem}
    h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:400;line-height:1.15;color:var(--ink);margin-bottom:1.2rem}
    .art-subtitle{font-size:19px;font-style:italic;font-weight:300;color:var(--ink-mid);line-height:1.6;border-left:2px solid var(--border);padding-left:1.1rem;margin-bottom:2.5rem}
    .art-divider{border:none;border-top:1px solid var(--border);margin-bottom:2.5rem}
    article{max-width:640px;margin:0 auto;padding:0 2rem 6rem}
    p{font-size:18px;line-height:1.9;color:var(--ink);margin-bottom:1.5rem}
    strong{font-weight:500}
    h2{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink);margin:3rem 0 1rem;line-height:1.3}
    .pullquote{font-family:var(--serif);font-size:22px;font-style:italic;font-weight:400;color:var(--ink);line-height:1.5;border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);padding:1.4rem 0;margin:2.5rem 0}
    .art-note{font-size:14px;color:var(--ink-mid);border-left:2px solid var(--border);padding-left:1rem;margin:2rem 0;font-style:italic;line-height:1.7}
    .art-footer{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--border);font-size:12px;color:var(--ink-light);letter-spacing:.05em}
    footer{border-top:1px solid var(--border);padding:2rem;text-align:center;font-size:12px;color:var(--ink-light)}
    @media(max-width:600px){p{font-size:16px;line-height:1.8}.pullquote{font-size:18px}nav,.article-header,article{padding-left:1.2rem;padding-right:1.2rem}}
