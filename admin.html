<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Margine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --ink: #2c1f0e; --ink-mid: #6b5540;
      --ink-light: #a08c75; --accent: #7a4f2d; --border: #d4c4ad;
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'Source Serif 4', Georgia, serif;
      --danger: #c0392b; --success: #27ae60;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 300; min-height: 100vh; }
    nav { border-bottom: 1px solid var(--border); padding: 1.4rem 2rem; display: flex; align-items: baseline; gap: 2rem; }
    .nav-logo { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); text-decoration: none; }
    .nav-sub { font-size: 13px; color: var(--ink-light); font-style: italic; }
    .nav-right { margin-left: auto; }
    .btn-logout { font-size: 12px; color: var(--ink-light); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 0.3rem 0.8rem; cursor: pointer; font-family: var(--body); }
    .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

    #login-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); padding: 2rem; }
    .login-box { background: #ede7d9; border: 1px solid var(--border); border-radius: 6px; padding: 2.5rem; width: 100%; max-width: 340px; text-align: center; }
    .login-box h2 { font-family: var(--serif); font-size: 24px; font-weight: 400; margin-bottom: 0.4rem; }
    .login-box p { font-size: 14px; color: var(--ink-mid); margin-bottom: 1.5rem; }
    .login-input { width: 100%; padding: 0.7rem 1rem; font-size: 15px; font-family: var(--body); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); outline: none; margin-bottom: 1rem; }
    .login-input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; padding: 0.7rem; font-size: 14px; font-family: var(--body); background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.85; }
    .login-error { font-size: 13px; color: var(--danger); margin-top: 0.8rem; display: none; }

    #admin-panel { display: none; max-width: 860px; margin: 0 auto; padding: 2rem; }
    .panel-section { margin-bottom: 3rem; }
    .panel-title { font-family: var(--serif); font-size: 22px; font-weight: 400; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }

    .article-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .article-row-info { flex: 1; min-width: 200px; }
    .article-row-title { font-family: var(--serif); font-size: 17px; font-weight: 400; }
    .article-row-meta { font-size: 12px; color: var(--ink-light); margin-top: 0.2rem; }
    .article-row-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-sm { font-size: 12px; padding: 0.3rem 0.7rem; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; font-family: var(--body); background: none; transition: background 0.2s; }
    .btn-hide { color: var(--ink-mid); }
    .btn-hide:hover { background: #ede7d9; }
    .btn-show { color: var(--success); border-color: var(--success); }
    .btn-show:hover { background: #eafaf1; }
    .btn-delete { color: var(--danger); border-color: var(--danger); }
    .btn-delete:hover { background: #fdf0ee; }
    .badge-hidden { font-size: 11px; padding: 0.15rem 0.5rem; border-radius: 10px; background: #ede7d9; color: var(--ink-light); margin-left: 0.5rem; }

    .form-group { margin-bottom: 1.2rem; }
    .form-label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-light); display: block; margin-bottom: 0.4rem; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 0.6rem 1rem; font-size: 15px; font-family: var(--body); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { min-height: 300px; resize: vertical; line-height: 1.7; }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 180px; }
    .btn-publish { padding: 0.7rem 2rem; font-size: 14px; font-family: var(--body); background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; transition: opacity 0.2s; }
    .btn-publish:hover { opacity: 0.85; }

    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--ink); color: #f5f0e8; padding: 0.8rem 1.4rem; border-radius: 4px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
    .loading { color: var(--ink-light); font-size: 14px; font-style: italic; padding: 1rem 0; }

    @media (max-width: 600px) {
      #admin-panel { padding: 1rem; }
      .article-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Margine</a>
  <span class="nav-sub">pannello di amministrazione</span>
  <div class="nav-right">
    <button class="btn-logout" id="logout-btn" style="display:none">Esci</button>
  </div>
</nav>

<div id="login-screen">
  <div class="login-box">
    <h2>Accesso</h2>
    <p>Inserisci la password per accedere al pannello</p>
    <input type="password" class="login-input" id="pwd-input" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">Accedi</button>
    <p class="login-error" id="login-error">Password errata.</p>
  </div>
</div>

<div id="admin-panel">
  <div class="panel-section">
    <h2 class="panel-title">Articoli pubblicati</h2>
    <div id="articles-list"><p class="loading">Caricamento articoli...</p></div>
  </div>
  <div class="panel-section">
    <h2 class="panel-title">Nuovo articolo</h2>
    <form id="new-article-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Titolo</label>
          <input type="text" class="form-input" id="art-title" placeholder="Titolo dell'articolo" required>
        </div>
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="art-category">
            <option>Psicologia</option>
            <option>Filosofia</option>
            <option>Politica</option>
            <option>Linguaggio</option>
            <option>Percezione &amp; Società</option>
            <option>Corpo &amp; Cervello</option>
            <option>Fisica</option>
            <option>Altro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Sottotitolo</label>
        <input type="text" class="form-input" id="art-subtitle" placeholder="Una riga descrittiva (opzionale)">
      </div>
      <div class="form-group">
        <label class="form-label">Testo (HTML — usa &lt;p&gt;, &lt;strong&gt;, &lt;h2&gt;, &lt;div class="pullquote"&gt;)</label>
        <textarea class="form-textarea" id="art-body" placeholder="<p>Il tuo articolo...</p>"></textarea>
      </div>
      <button type="submit" class="btn-publish">Pubblica articolo →</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GH_TOKEN = ['ghp_wIz0os','lOzBRQZSXE','pNbbmumahqLdsw1UNppx'].join('');
const REPO = "lauranappi/margine";
const BRANCH = "master";
const ADMIN_PWD = "margine2026";

function checkAuth() { return sessionStorage.getItem('margine_auth') === '1'; }

document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  if (document.getElementById('pwd-input').value === ADMIN_PWD) {
    sessionStorage.setItem('margine_auth', '1');
    showPanel();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('margine_auth');
  location.reload();
});

function showPanel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'inline-block';
  loadArticles();
}

if (checkAuth()) showPanel();

async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
    headers: { 'Authorization': `token ${GH_TOKEN}` }
  });
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha, branch: BRANCH })
  });
  return r.json();
}

async function ghDelete(path, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'DELETE',
    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha, branch: BRANCH })
  });
  return r.json();
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

async function loadArticles() {
  const list = document.getElementById('articles-list');
  list.innerHTML = '<p class="loading">Caricamento...</p>';
  try {
    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g, ''))));
    const files = await ghGet('articoli');
    const articles = files.filter(f => f.name.endsWith('.html'));
    if (articles.length === 0) { list.innerHTML = '<p class="loading">Nessun articolo trovato.</p>'; return; }
    let html = '';
    for (const art of articles) {
      const isVisible = indexContent.includes(`href="articoli/${art.name}"`);
      const slug = art.name.replace('.html', '').replace(/-/g, ' ');
      html += `<div class="article-row">
        <div class="article-row-info">
          <div class="article-row-title">
            <a href="articoli/${art.name}" target="_blank" style="color:var(--ink);text-decoration:none;">${slug}</a>
            ${!isVisible ? '<span class="badge-hidden">nascosto</span>' : ''}
          </div>
          <div class="article-row-meta">${art.name}</div>
        </div>
        <div class="article-row-actions">
          ${isVisible
            ? `<button class="btn-sm btn-hide" onclick="toggleVisibility('${art.name}', false)">Nascondi</button>`
            : `<button class="btn-sm btn-show" onclick="toggleVisibility('${art.name}', true)">Mostra</button>`}
          <button class="btn-sm btn-delete" onclick="deleteArticle('${art.name}')">Elimina</button>
        </div>
      </div>`;
    }
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = '<p class="loading">Errore nel caricamento.</p>';
  }
}

async function toggleVisibility(filename, show) {
  try {
    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g, ''))));
    let updated;
    if (!show) {
      const re = new RegExp(`([ \\t]*<a class="article-card"[^>]*href="articoli/${filename.replace(/\./g, '\\.')}[^"]*"[\\s\\S]*?<\\/a>)`, 'g');
      updated = indexContent.replace(re, `<!--HIDDEN:${filename}\n$1\n-->`);
    } else {
      const re = new RegExp(`<!--HIDDEN:${filename.replace(/\./g, '\\.')}\\n([\\s\\S]*?)\\n-->`, 'g');
      updated = indexContent.replace(re, '$1');
    }
    await ghPut('index.html', updated, indexData.sha, `${show ? 'Mostra' : 'Nascondi'} articolo: ${filename}`);
    showToast(show ? 'Articolo reso visibile ✓' : 'Articolo nascosto ✓');
    loadArticles();
  } catch(e) { showToast('Errore durante l\'operazione', true); }
}

async function deleteArticle(filename) {
  if (!confirm(`Eliminare definitivamente "${filename}"?`)) return;
  try {
    const fileData = await ghGet(`articoli/${filename}`);
    await ghDelete(`articoli/${filename}`, fileData.sha, `Elimina: ${filename}`);
    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g, ''))));
    const re = new RegExp(`\\n\\n[ \\t]*<a class="article-card"[^>]*href="articoli/${filename.replace(/\./g, '\\.')}[^"]*"[\\s\\S]*?<\\/a>`, 'g');
    const updated = indexContent.replace(re, '');
    await ghPut('index.html', updated, indexData.sha, `Rimuove card: ${filename}`);
    showToast('Articolo eliminato ✓');
    loadArticles();
  } catch(e) { showToast('Errore durante l\'eliminazione', true); }
}

function slugify(t) {
  return t.toLowerCase()
    .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e')
    .replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o')
    .replace(/[ùúûü]/g,'u').replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

document.getElementById('new-article-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('art-title').value.trim();
  const category = document.getElementById('art-category').value;
  const subtitle = document.getElementById('art-subtitle').value.trim();
  const body = document.getElementById('art-body').value.trim();
  if (!title || !body) { showToast('Titolo e testo sono obbligatori', true); return; }

  const slug = slugify(title);
  const filename = `${slug}.html`;
  const date = new Date().toISOString().split('T')[0];
  const dateDisplay = new Date().toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
  const dateDisplayCap = dateDisplay.charAt(0).toUpperCase() + dateDisplay.slice(1);
  const readingTime = Math.max(3, Math.round(body.replace(/<[^>]+>/g,'').split(/\s+/).length / 200));
  const pageUrl = `https://lauranappi.github.io/margine/articoli/${filename}`;

  const articleHtml = `<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Laura Nappi">
  <meta name="description" content="${subtitle || title}">
  <meta property="og:title" content="${title} — Margine">
  <meta property="og:description" content="${subtitle || title}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="${pageUrl}">
  <title>${title} — Margine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f5f0e8; --ink: #2c1f0e; --ink-mid: #6b5540; --ink-light: #a08c75; --accent: #7a4f2d; --border: #d4c4ad; --serif: 'Playfair Display', Georgia, serif; --body: 'Source Serif 4', Georgia, serif; }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 300; min-height: 100vh; }
    .progress-bar { position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: #7a4f2d; z-index: 100; transition: width 0.1s linear; }
    nav { border-bottom: 1px solid var(--border); padding: 1.4rem 2rem; display: flex; align-items: baseline; gap: 2rem; }
    .nav-logo { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); text-decoration: none; }
    .nav-back { font-size: 13px; color: var(--ink-light); text-decoration: none; }
    .nav-back:hover { color: var(--accent); }
    .article-header { max-width: 700px; margin: 4rem auto 3rem; padding: 0 2rem; }
    .art-kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 1.2rem; }
    h1 { font-family: var(--serif); font-size: clamp(30px, 5vw, 46px); font-weight: 400; line-height: 1.15; color: var(--ink); margin-bottom: 1.2rem; }
    .art-subtitle { font-size: 19px; font-style: italic; font-weight: 300; color: var(--ink-mid); line-height: 1.6; border-left: 2px solid var(--border); padding-left: 1.1rem; margin-bottom: 2.5rem; }
    .art-divider { border: none; border-top: 1px solid var(--border); margin-bottom: 2.5rem; }
    article { max-width: 640px; margin: 0 auto; padding: 0 2rem 6rem; }
    p { font-size: 18px; line-height: 1.9; color: var(--ink); margin-bottom: 1.5rem; }
    strong { font-weight: 500; }
    h2 { font-family: var(--serif); font-size: 24px; font-weight: 400; color: var(--ink); margin: 3rem 0 1rem; }
    .pullquote { font-family: var(--serif); font-size: 22px; font-style: italic; color: var(--ink); line-height: 1.5; border-top: 1.5px solid var(--border); border-bottom: 1.5px solid var(--border); padding: 1.4rem 0; margin: 2.5rem 0; }
    .art-note { font-size: 14px; color: var(--ink-mid); border-left: 2px solid var(--border); padding-left: 1rem; margin: 2rem 0; font-style: italic; line-height: 1.7; }
    .art-footer { margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-light); letter-spacing: 0.05em; }
    footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; font-size: 12px; color: var(--ink-light); }
    @media (max-width: 600px) { p { font-size: 16px; } .pullquote { font-size: 18px; } nav, .article-header, article { padding-left: 1.2rem; padding-right: 1.2rem; } }
  </style>
</head>
<body>
  <div class="progress-bar" id="progress"></div>
  <nav>
    <a href="../index.html" class="nav-logo">Margine</a>
    <a href="../index.html" class="nav-back">← tutti gli articoli</a>
  </nav>
  <div class="article-header">
    <p class="art-kicker">${category} · ${dateDisplayCap}</p>
    <h1>${title}</h1>
    ${subtitle ? `<p class="art-subtitle">${subtitle}</p>` : ''}
    <hr class="art-divider">
  </div>
  <article>
    ${body}
    <p style="margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);">
      <a href="../index.html" style="color:var(--accent);font-size:15px;text-decoration:none;">← Tutti gli articoli</a>
    </p>
    <div class="art-footer">Laura Nappi · ${dateDisplayCap} · Scritto con Claude (Anthropic)</div>
  </article>
  <footer><a href="../index.html" style="color:var(--ink-light);text-decoration:none;">Margine</a> · © 2026 Laura Nappi</footer>
  <script>
    (function(){var b=document.getElementById('progress');window.addEventListener('scroll',function(){var d=document.documentElement,s=d.scrollTop||document.body.scrollTop,t=d.scrollHeight-d.clientHeight;b.style.width=(t>0?(s/t)*100:0)+'%';});})();
  <\/script>
</body>
</html>`;

  try {
    const pushR = await fetch(`https://api.github.com/repos/${REPO}/contents/articoli/${filename}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Nuovo articolo: ${title}`, content: btoa(unescape(encodeURIComponent(articleHtml))), branch: BRANCH })
    });
    if (!pushR.ok) throw new Error('push failed');

    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g, ''))));
    const newCard = `    <a class="article-card" href="articoli/${filename}" data-date="${date}">
      <p class="card-meta">${category} · ${dateDisplayCap}</p>
      <h2 class="card-title">${title}</h2>
      ${subtitle ? `<p class="card-subtitle">${subtitle}</p>` : ''}
      <span class="card-time">${readingTime} min · →</span>
    </a>\n\n    <!-- TEMPLATE PER NUOVI ARTICOLI — copia e incolla il blocco qui sopra -->`;

    const updatedIndex = indexContent.replace('    <!-- TEMPLATE PER NUOVI ARTICOLI — copia e incolla il blocco qui sopra -->', newCard);
    await ghPut('index.html', updatedIndex, indexData.sha, `Aggiunge card: ${title}`);
    showToast(`"${title}" pubblicato ✓`);
    document.getElementById('new-article-form').reset();
    loadArticles();
  } catch(e) { showToast('Errore durante la pubblicazione', true); console.error(e); }
});
</script>
</body>
</html>
