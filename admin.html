<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Margine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --ink: #2c1f0e; --ink-mid: #6b5540;
      --ink-light: #a08c75; --accent: #7a4f2d; --border: #d4c4ad;
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'Source Serif 4', Georgia, serif;
      --danger: #c0392b; --success: #2e7d52; --warning: #b36a00;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 300; min-height: 100vh; }

    /* NAV */
    nav { border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 1.5rem; }
    .nav-logo { font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--ink); text-decoration: none; }
    .nav-sub { font-size: 12px; color: var(--ink-light); font-style: italic; }
    .nav-right { margin-left: auto; }
    .btn-logout { font-size: 12px; color: var(--ink-light); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 0.3rem 0.8rem; cursor: pointer; font-family: var(--body); }
    .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

    /* LOGIN */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 56px); }
    .login-box { background: #ede7d9; border: 1px solid var(--border); border-radius: 6px; padding: 2.5rem; width: 320px; text-align: center; }
    .login-box h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; margin-bottom: 0.4rem; }
    .login-box p { font-size: 13px; color: var(--ink-mid); margin-bottom: 1.5rem; }
    .login-input { width: 100%; padding: 0.65rem 1rem; font-size: 15px; font-family: var(--body); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); outline: none; margin-bottom: 1rem; }
    .login-input:focus { border-color: var(--accent); }
    .btn-accent { padding: 0.65rem 1.5rem; font-size: 14px; font-family: var(--body); background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; width: 100%; }
    .btn-accent:hover { opacity: 0.88; }
    .login-error { font-size: 13px; color: var(--danger); margin-top: 0.8rem; display: none; }

    /* PANEL */
    #admin-panel { display: none; }
    .panel-tabs { border-bottom: 1px solid var(--border); display: flex; padding: 0 2rem; gap: 0; }
    .tab-btn { font-family: var(--body); font-size: 14px; padding: 1rem 1.5rem; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink-light); margin-bottom: -1px; transition: color 0.2s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--ink-mid); }

    .tab-content { display: none; max-width: 820px; margin: 0 auto; padding: 2rem; }
    .tab-content.active { display: block; }

    /* ARTICLE GRID */
    .section-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 1rem; }
    .article-grid { display: grid; gap: 1rem; margin-bottom: 2rem; }
    .article-card-admin {
      background: #fff9f2; border: 1px solid var(--border); border-radius: 4px;
      padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem;
    }
    .article-card-admin.hidden { background: #f0ece4; opacity: 0.7; }
    .card-admin-info { flex: 1; min-width: 0; }
    .card-admin-title { font-family: var(--serif); font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-admin-title a { color: var(--ink); text-decoration: none; }
    .card-admin-title a:hover { color: var(--accent); }
    .card-admin-meta { font-size: 11px; color: var(--ink-light); margin-top: 0.2rem; }
    .card-admin-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-action { font-size: 12px; padding: 0.3rem 0.7rem; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; font-family: var(--body); background: none; white-space: nowrap; }
    .btn-action:hover { background: var(--bg); }
    .btn-action.danger { color: var(--danger); border-color: var(--danger); }
    .btn-action.danger:hover { background: #fdf0ee; }
    .btn-action.success { color: var(--success); border-color: var(--success); }
    .btn-action.success:hover { background: #f0faf5; }
    .btn-action.warning { color: var(--warning); border-color: var(--warning); }
    .btn-action.warning:hover { background: #fdf6ed; }
    .empty-msg { font-size: 14px; color: var(--ink-light); font-style: italic; padding: 1rem 0; }
    .loading-msg { font-size: 14px; color: var(--ink-light); font-style: italic; padding: 1rem 0; }

    /* EDITOR */
    .editor-wrap { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .editor-toolbar { background: #ede7d9; border-bottom: 1px solid var(--border); padding: 0.6rem 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tb-btn {
      font-size: 12px; padding: 0.3rem 0.7rem; border-radius: 3px;
      border: 1px solid var(--border); cursor: pointer; background: var(--bg);
      font-family: var(--body); color: var(--ink); white-space: nowrap;
    }
    .tb-btn:hover { background: #f5f0e8; border-color: var(--accent); }
    .tb-sep { width: 1px; background: var(--border); margin: 0 0.2rem; }
    .editor-area { width: 100%; min-height: 360px; padding: 1rem 1.2rem; font-size: 16px; font-family: var(--body); line-height: 1.8; border: none; outline: none; resize: vertical; background: var(--bg); color: var(--ink); }

    /* PREVIEW */
    .preview-box {
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1.5rem 2rem; background: var(--bg); margin-top: 1rem;
      max-height: 400px; overflow-y: auto; display: none;
    }
    .preview-box p { font-size: 17px; line-height: 1.85; margin-bottom: 1.2rem; }
    .preview-box h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; margin: 2rem 0 0.8rem; }
    .preview-box .pullquote { font-family: var(--serif); font-size: 20px; font-style: italic; border-top: 1.5px solid var(--border); border-bottom: 1.5px solid var(--border); padding: 1.2rem 0; margin: 2rem 0; }
    .preview-box .art-note { font-size: 13px; color: var(--ink-mid); border-left: 2px solid var(--border); padding-left: 1rem; margin: 1.5rem 0; font-style: italic; line-height: 1.7; }
    .preview-box strong { font-weight: 500; }

    /* FORM */
    .form-group { margin-bottom: 1.1rem; }
    .form-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); display: block; margin-bottom: 0.4rem; }
    .form-input, .form-select { width: 100%; padding: 0.6rem 1rem; font-size: 15px; font-family: var(--body); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--ink); outline: none; }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 160px; }
    .btn-publish { padding: 0.7rem 2rem; font-size: 14px; font-family: var(--body); background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; }
    .btn-publish:hover { opacity: 0.88; }
    .btn-preview { padding: 0.7rem 1.2rem; font-size: 14px; font-family: var(--body); background: none; color: var(--ink-mid); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; margin-right: 0.5rem; }
    .btn-preview:hover { background: #ede7d9; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--ink); color: #f5f0e8; padding: 0.8rem 1.4rem; border-radius: 4px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    .toast.err { background: var(--danger); }

    @media (max-width: 600px) {
      .tab-content { padding: 1rem; }
      .card-admin-actions { flex-direction: column; }
      nav { padding: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Margine</a>
  <span class="nav-sub">admin</span>
  <div class="nav-right">
    <button class="btn-logout" id="logout-btn" style="display:none">Esci</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Accesso</h2>
    <p>Pannello di gestione di Margine</p>
    <input type="password" class="login-input" id="pwd-input" placeholder="Password" autocomplete="current-password">
    <button class="btn-accent" id="login-btn">Accedi</button>

</div>

<!-- PANEL -->
<div id="admin-panel">
  <div class="panel-tabs">
    <button class="tab-btn active" data-tab="articles">Articoli</button>
    <button class="tab-btn" data-tab="new">Nuovo articolo</button>
  </div>

  <!-- TAB: ARTICOLI -->
  <div class="tab-content active" id="tab-articles">
    <div id="visible-section">
      <p class="loading-msg">Caricamento articoli...</p>
    </div>
  </div>

  <!-- TAB: NUOVO ARTICOLO -->
  <div class="tab-content" id="tab-new">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Titolo</label>
        <input type="text" class="form-input" id="art-title" placeholder="Titolo dell'articolo">
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-select" id="art-category">
          <option>Psicologia</option>
          <option>Filosofia</option>
          <option>Politica</option>
          <option>Linguaggio</option>
          <option>Percezione &amp; Società</option>
          <option>Corpo &amp; Cervello</option>
          <option>Fisica</option>
          <option>Altro</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Sottotitolo</label>
      <input type="text" class="form-input" id="art-subtitle" placeholder="Una riga descrittiva (opzionale)">
    </div>
    <div class="form-group">
      <label class="form-label">Testo</label>
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="insertBlock('p')">¶ Paragrafo</button>
          <button class="tb-btn" onclick="insertBlock('h2')">H Titolo sezione</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="insertBlock('pullquote')">❝ Citazione</button>
          <button class="tb-btn" onclick="insertBlock('note')">📎 Nota</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="wrapSelection('strong')"><b>B</b> Grassetto</button>
          <button class="tb-btn" onclick="wrapSelection('em')"><i>I</i> Corsivo</button>
        </div>
        <textarea class="editor-area" id="art-body" placeholder="Inizia a scrivere... usa i bottoni sopra per aggiungere paragrafi, titoli, citazioni."></textarea>
      </div>

    <div style="margin-top:1rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
      <button class="btn-preview" onclick="togglePreview()">Anteprima</button>
      <button class="btn-publish" onclick="publishArticle()">Pubblica →</button>
    </div>
    <div class="preview-box" id="preview-box"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GH_TOKEN = ['ghp_wIz0os','lOzBRQZSXE','pNbbmumahqLdsw1UNppx'].join('');
const REPO = 'lauranappi/margine';
const BRANCH = 'master';
const PWD = 'margine2026';

// State in memory
let hiddenFiles = [];
let allArticles = [];

// AUTH
function checkAuth() { return sessionStorage.getItem('ma') === '1'; }
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('pwd-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
function doLogin() {
  if(document.getElementById('pwd-input').value === PWD) {
    sessionStorage.setItem('ma','1');
    showPanel();
  } else {
    document.getElementById('login-error').style.display='block';
    document.getElementById('pwd-input').value='';
  }
}
document.getElementById('logout-btn').addEventListener('click', () => { sessionStorage.removeItem('ma'); location.reload(); });
function showPanel() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-panel').style.display='block';
  document.getElementById('logout-btn').style.display='inline-block';
  loadArticles();
}
if(checkAuth()) showPanel();

// TABS
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// GH API
async function ghGet(path) {
  const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref='+BRANCH, {
    headers: {'Authorization': 'token '+GH_TOKEN, 'Cache-Control': 'no-cache'}
  });
  if(!r.ok) throw new Error('GET '+path+': '+r.status);
  return r.json();
}
async function ghPut(path, content, sha, msg) {
  const body = {message: msg, content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH};
  if(sha) body.sha = sha;
  const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path, {
    method:'PUT', headers:{'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!r.ok) { const e=await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}
async function ghDelete(path, sha, msg) {
  const r = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path, {
    method:'DELETE', headers:{'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'},
    body: JSON.stringify({message:msg, sha, branch:BRANCH})
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

// TOAST
function toast(msg, err=false) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  setTimeout(()=>t.className='toast',3000);
}

// RENDER ARTICLES (uses in-memory state, no network)
function renderArticles() {
  const sec = document.getElementById('visible-section');
  const visible = allArticles.filter(a => !hiddenFiles.includes(a.name));
  const hidden = allArticles.filter(a => hiddenFiles.includes(a.name));

  let html = '';

  html += '<p class="section-label" style="margin-bottom:0.8rem;">Visibili ('+visible.length+')</p>';
  if(visible.length === 0) {
    html += '<p class="empty-msg">Nessun articolo visibile.</p>';
  } else {
    html += '<div class="article-grid">';
    visible.forEach(art => {
      const title = art.name.replace('.html','').replace(/-/g,' ');
      html += '<div class="article-card-admin"><div class="card-admin-info"><div class="card-admin-title"><a href="articoli/'+art.name+'" target="_blank">'+title+'</a></div><div class="card-admin-meta">'+art.name+'</div></div><div class="card-admin-actions"><button class="btn-action warning" onclick="toggleVisibility(''+art.name+'',false)">Nascondi</button><button class="btn-action danger" onclick="deleteArticle(''+art.name+'')">Elimina</button></div></div>';
    });
    html += '</div>';
  }

  html += '<p class="section-label" style="margin-top:2rem;margin-bottom:0.8rem;">Nascosti ('+hidden.length+')</p>';
  if(hidden.length === 0) {
    html += '<p class="empty-msg">Nessun articolo nascosto.</p>';
  } else {
    html += '<div class="article-grid">';
    hidden.forEach(art => {
      const title = art.name.replace('.html','').replace(/-/g,' ');
      html += '<div class="article-card-admin hidden"><div class="card-admin-info"><div class="card-admin-title"><a href="articoli/'+art.name+'" target="_blank">'+title+'</a></div><div class="card-admin-meta">'+art.name+'</div></div><div class="card-admin-actions"><button class="btn-action success" onclick="toggleVisibility(''+art.name+'',true)">Rendi visibile</button><button class="btn-action danger" onclick="deleteArticle(''+art.name+'')">Elimina</button></div></div>';
    });
    html += '</div>';
  }

  sec.innerHTML = html;
}

// LOAD ARTICLES (network call, updates memory then renders)
async function loadArticles() {
  const sec = document.getElementById('visible-section');
  sec.innerHTML = '<p class="loading-msg">Caricamento...</p>';
  try {
    const [hiddenData, files] = await Promise.all([ghGet('hidden.json'), ghGet('articoli')]);
    const hiddenRaw = decodeURIComponent(escape(atob(hiddenData.content.replace(/\n/g,''))));
    hiddenFiles = JSON.parse(hiddenRaw).hidden || [];
    allArticles = files.filter(f => f.name.endsWith('.html'));
    renderArticles();
  } catch(e) {
    sec.innerHTML = '<p class="empty-msg">Errore: '+e.message+'</p>';
  }
}

// TOGGLE VISIBILITY — aggiorna stato in memoria, poi salva in background
async function toggleVisibility(filename, show) {
  // Aggiorna subito la memoria e ridisegna
  if(!show) {
    if(!hiddenFiles.includes(filename)) hiddenFiles.push(filename);
  } else {
    hiddenFiles = hiddenFiles.filter(f => f !== filename);
  }
  renderArticles();

  // Salva su GitHub in background
  try {
    const hiddenData = await ghGet('hidden.json');
    const newJson = JSON.stringify({hidden: hiddenFiles}, null, 2);
    await ghPut('hidden.json', newJson, hiddenData.sha, (show?'Mostra':'Nascondi')+': '+filename);
    toast(show ? 'Reso visibile ✓' : 'Nascosto ✓');
  } catch(e) {
    toast('Errore salvataggio: '+e.message, true);
    // Ripristina
    if(!show) { hiddenFiles = hiddenFiles.filter(f => f !== filename); }
    else { if(!hiddenFiles.includes(filename)) hiddenFiles.push(filename); }
    renderArticles();
  }
}

// DELETE
async function deleteArticle(filename) {
  if(!confirm('Eliminare definitivamente "'+filename+'"?\nQuesta azione non è reversibile.')) return;
  try {
    const fileData = await ghGet('articoli/'+filename);
    await ghDelete('articoli/'+filename, fileData.sha, 'Elimina: '+filename);
    // Remove from index.html card
    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g,''))));
    const esc = filename.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp('\\n\\n[ \\t]*<a class="article-card"[^>]*href="articoli/'+esc+'[^"]*"[\\s\\S]*?<\\/a>', 'g');
    const updated = indexContent.replace(re,'');
    await ghPut('index.html', updated, indexData.sha, 'Rimuove card: '+filename);
    // Update memory
    allArticles = allArticles.filter(a => a.name !== filename);
    hiddenFiles = hiddenFiles.filter(f => f !== filename);
    renderArticles();
    toast('Eliminato ✓');
  } catch(e) { toast('Errore: '+e.message, true); }
}

// EDITOR
function insertBlock(type) {
  const ta = document.getElementById('art-body');
  const pos = ta.selectionEnd;
  const before = ta.value.substring(0, pos);
  const after = ta.value.substring(pos);
  const nl = before.length > 0 && !before.endsWith('\n\n') ? '\n\n' : '';
  let snippet = '';
  if(type === 'p') snippet = `${nl}<p>Scrivi qui il paragrafo.</p>`;
  if(type === 'h2') snippet = `${nl}<h2>Titolo sezione</h2>`;
  if(type === 'pullquote') snippet = `${nl}<div class="pullquote">«La citazione va qui.»</div>`;
  if(type === 'note') snippet = `${nl}<div class="art-note">Nota a margine: testo della nota.</div>`;
  ta.value = before + snippet + after;
  const newPos = pos + snippet.length;
  ta.selectionStart = ta.selectionEnd = newPos;
  ta.focus();
}

function wrapSelection(tag) {
  const ta = document.getElementById('art-body');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end) || 'testo';
  const wrapped = `<${tag}>${selected}</${tag}>`;
  ta.value = ta.value.substring(0,start) + wrapped + ta.value.substring(end);
  ta.selectionStart = start; ta.selectionEnd = start + wrapped.length;
  ta.focus();
}

function togglePreview() {
  const box = document.getElementById('preview-box');
  const body = document.getElementById('art-body').value;
  if(box.style.display === 'block') { box.style.display='none'; return; }
  box.innerHTML = body || '<em>Niente da mostrare.</em>';
  box.style.display = 'block';
}

// SLUGIFY
function slugify(t) {
  return t.toLowerCase()
    .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e')
    .replace(/[ìíîï]/g,'i').replace(/[òóôõö]/g,'o')
    .replace(/[ùúûü]/g,'u').replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

// PUBLISH
async function publishArticle() {
  const title = document.getElementById('art-title').value.trim();
  const category = document.getElementById('art-category').value;
  const subtitle = document.getElementById('art-subtitle').value.trim();
  const body = document.getElementById('art-body').value.trim();
  if(!title || !body) { toast('Titolo e testo sono obbligatori', true); return; }

  const slug = slugify(title);
  const filename = `${slug}.html`;
  const date = new Date().toISOString().split('T')[0];
  const dateDisplay = new Date().toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  const dateCap = dateDisplay.charAt(0).toUpperCase()+dateDisplay.slice(1);
  const readTime = Math.max(3, Math.round(body.replace(/<[^>]+>/g,'').split(/\s+/).length/200));

  const html = `<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Laura Nappi">
  <meta name="description" content="${(subtitle||title).replace(/"/g,'&quot;')}">
  <meta property="og:title" content="${title.replace(/"/g,'&quot;')} — Margine">
  <meta property="og:description" content="${(subtitle||title).replace(/"/g,'&quot;')}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://lauranappi.github.io/margine/articoli/${filename}">
  <title>${title} — Margine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f0e8;--ink:#2c1f0e;--ink-mid:#6b5540;--ink-light:#a08c75;--accent:#7a4f2d;--border:#d4c4ad;--serif:'Playfair Display',Georgia,serif;--body:'Source Serif 4',Georgia,serif}
    body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;min-height:100vh}
    .progress-bar{position:fixed;top:0;left:0;width:0%;height:3px;background:#7a4f2d;z-index:100;transition:width .1s linear}
    nav{border-bottom:1px solid var(--border);padding:1.4rem 2rem;display:flex;align-items:baseline;gap:2rem}
    .nav-logo{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);text-decoration:none}
    .nav-back{font-size:13px;color:var(--ink-light);text-decoration:none}
    .nav-back:hover{color:var(--accent)}
    .article-header{max-width:700px;margin:4rem auto 3rem;padding:0 2rem}
    .art-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-light);margin-bottom:1.2rem}
    h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:400;line-height:1.15;color:var(--ink);margin-bottom:1.2rem}
    .art-subtitle{font-size:19px;font-style:italic;font-weight:300;color:var(--ink-mid);line-height:1.6;border-left:2px solid var(--border);padding-left:1.1rem;margin-bottom:2.5rem}
    .art-divider{border:none;border-top:1px solid var(--border);margin-bottom:2.5rem}
    article{max-width:640px;margin:0 auto;padding:0 2rem 6rem}
    p{font-size:18px;line-height:1.9;color:var(--ink);margin-bottom:1.5rem}
    strong{font-weight:500}
    h2{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink);margin:3rem 0 1rem;line-height:1.3}
    .pullquote{font-family:var(--serif);font-size:22px;font-style:italic;font-weight:400;color:var(--ink);line-height:1.5;border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);padding:1.4rem 0;margin:2.5rem 0}
    .art-note{font-size:14px;color:var(--ink-mid);border-left:2px solid var(--border);padding-left:1rem;margin:2rem 0;font-style:italic;line-height:1.7}
    .art-footer{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--border);font-size:12px;color:var(--ink-light);letter-spacing:.05em}
    footer{border-top:1px solid var(--border);padding:2rem;text-align:center;font-size:12px;color:var(--ink-light)}
    @media(max-width:600px){p{font-size:16px;line-height:1.8}.pullquote{font-size:18px}nav,.article-header,article{padding-left:1.2rem;padding-right:1.2rem}}
  </style>
</head>
<body>
  <div class="progress-bar" id="progress"></div>
  <nav>
    <a href="../index.html" class="nav-logo">Margine</a>
    <a href="../index.html" class="nav-back">← tutti gli articoli</a>
  </nav>
  <div class="article-header">
    <p class="art-kicker">${category} · ${dateCap}</p>
    <h1>${title}</h1>
    ${subtitle ? `<p class="art-subtitle">${subtitle}</p>` : ''}
    <hr class="art-divider">
  </div>
  <article>
    ${body}
    <p style="margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
      <a href="../index.html" style="color:var(--accent);font-size:15px;text-decoration:none">← Tutti gli articoli</a>
    </p>
    <div class="art-footer">Laura Nappi · ${dateCap} · Scritto con Claude (Anthropic)</div>
  </article>
  <footer><a href="../index.html" style="color:var(--ink-light);text-decoration:none">Margine</a> · © 2026 Laura Nappi</footer>
  <script>(function(){var b=document.getElementById('progress');window.addEventListener('scroll',function(){var d=document.documentElement,s=d.scrollTop||document.body.scrollTop,t=d.scrollHeight-d.clientHeight;b.style.width=(t>0?(s/t)*100:0)+'%'})})()<\/script>
</body>
</html>`;

  try {
    toast('Pubblicazione in corso...');
    await ghPut(`articoli/${filename}`, html, null, `Nuovo articolo: ${title}`);
    const indexData = await ghGet('index.html');
    const indexContent = decodeURIComponent(escape(atob(indexData.content.replace(/\n/g,''))));
    const card = `    <a class="article-card" href="articoli/${filename}" data-date="${date}">
      <p class="card-meta">${category} · ${dateCap}</p>
      <h2 class="card-title">${title}</h2>
      ${subtitle ? `<p class="card-subtitle">${subtitle}</p>` : ''}
      <span class="card-time">${readTime} min · →</span>
    </a>\n\n    <!-- TEMPLATE PER NUOVI ARTICOLI — copia e incolla il blocco qui sopra -->`;
    const updatedIndex = indexContent.replace('    <!-- TEMPLATE PER NUOVI ARTICOLI — copia e incolla il blocco qui sopra -->', card);
    await ghPut('index.html', updatedIndex, indexData.sha, `Aggiunge card: ${title}`);
    toast(`"${title}" pubblicato ✓`);
    document.getElementById('art-title').value='';
    document.getElementById('art-subtitle').value='';
    document.getElementById('art-body').value='';
    document.getElementById('preview-box').style.display='none';
    // Switch to articles tab
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.querySelector('[data-tab="articles"]').classList.add('active');
    document.getElementById('tab-articles').classList.add('active');
    loadArticles();
  } catch(e) { toast('Errore: '+e.message, true); }
}
</script>
</body>
</html>
